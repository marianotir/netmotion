[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "netmotion"
version = "0.1.0"
description = "Dynamics on complex networks in Python: growth, epidemics, opinions, immunisation and interbank contagion, with animations. The models of the book Networks in Motion."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mariano Tirado Alonso" }]
keywords = [
    "complex networks",
    "network dynamics",
    "epidemic propagation",
    "systemic risk",
    "interbank contagion",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/marianotir/netmotion"
Repository = "https://github.com/marianotir/netmotion"
Changelog = "https://github.com/marianotir/netmotion/blob/main/CHANGELOG.md"
Tutorials = "https://github.com/marianotir/networks-in-motion-tutorials"

[tool.hatch.build.targets.wheel]
packages = ["src/netmotion"]

# The source archive carries the code and its tests only: the book manuscript, the
# figures and the PDFs are not MIT-licensed and stay in the repository.
[tool.hatch.build.targets.sdist]
include = ["src/netmotion", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running reproduction simulations",
    "reproduction: asserts a result stated in the 2011 thesis",
    "crossvalidation: compares an original implementation against NetworkX",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
ignore = ["E501"]
